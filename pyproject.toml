[project]
name = "cs2"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "fliegenderhollaender", email = "116984393+fliegenderhollaender@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "ipykernel>=6.31.0",
    "jupyterlab>=4.6.4",
    "jupyterlab-lsp>=5.3.0",
    "jupyterlab-vim>=4.1.4",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "python-lsp-server>=1.15.0",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "spyder-kernels>=3.1.6",
]

[project.scripts]
cs2 = "cs2:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pandas-stubs>=3.0.5.260914",
    "scikit-learn-stubs>=0.0.3",
    "scipy-stubs>=1.18.1.1",
]
